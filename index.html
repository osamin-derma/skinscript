    <style id="boot-splash-style">
      #boot-splash{ position:fixed; inset:0; z-index:2147483000; transition:opacity .55s ease; }
      #boot-splash.boot-hide{ opacity:0; pointer-events:none; }
      /* concept: Heartbeat Halo (scoped under .pulse-stage) */
.pulse-stage{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(60% 42% at 50% 30%, rgba(200,162,75,0.07), rgba(200,162,75,0) 70%),
    radial-gradient(130% 100% at 50% 40%, #233534 0%, #16222b 52%, #0f172a 100%);
  font-family:Inter,system-ui,-apple-system,sans-serif;
}
.pulse-stage .pulse-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:pulse-enter .7s ease-out both;
}
.pulse-stage .pulse-logo-wrap{
  position:relative;
  width:128px;
  height:128px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:42px;
}
.pulse-stage .pulse-halo{
  position:absolute;
  top:50%;
  left:50%;
  width:212px;
  height:212px;
  margin:-106px 0 0 -106px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(200,162,75,0.24) 0%, rgba(200,162,75,0.09) 40%, rgba(200,162,75,0) 70%);
  animation:pulse-glow 2s ease-in-out infinite;
  z-index:1;
}
.pulse-stage .pulse-ring{
  position:absolute;
  top:50%;
  left:50%;
  width:132px;
  height:132px;
  margin:-66px 0 0 -66px;
  border-radius:50%;
  border:1.5px solid rgba(200,162,75,0.5);
  opacity:0;
  z-index:2;
  animation:pulse-ripple 2s ease-out infinite;
}
.pulse-stage .pulse-ring-1{ animation-delay:0s; }
.pulse-stage .pulse-ring-2{ animation-delay:.66s; border-color:rgba(195,205,208,0.45); }
.pulse-stage .pulse-ring-3{ animation-delay:1.33s; }
.pulse-stage .pulse-logo{
  position:relative;
  z-index:3;
  width:128px;
  height:128px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  box-shadow:0 10px 34px rgba(0,0,0,0.55), 0 0 0 1px rgba(200,162,75,0.35), 0 0 22px rgba(200,162,75,0.16);
  animation:pulse-breathe 2s ease-in-out infinite;
}
.pulse-stage .pulse-ecg{
  width:236px;
  height:64px;
  margin-bottom:28px;
}
.pulse-stage .pulse-ecg-svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}
.pulse-stage .pulse-ecg-track{
  fill:none;
  stroke:rgba(195,205,208,0.20);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.pulse-stage .pulse-ecg-beam{
  fill:none;
  stroke:#e8cd86;
  stroke-width:2.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:14 120;
  stroke-dashoffset:0;
  filter:drop-shadow(0 0 4px rgba(232,205,134,0.9)) drop-shadow(0 0 10px rgba(200,162,75,0.5));
  animation:pulse-sweep 2.6s linear infinite;
}
.pulse-stage .pulse-wordmark{
  font-weight:800;
  font-size:19px;
  letter-spacing:0.12em;
  color:#f4eede;
  line-height:1;
  padding-left:0.12em;
}
.pulse-stage .pulse-t{
  font-style:italic;
  background:linear-gradient(135deg,#e8cd86 0%,#c8a24b 55%,#9c7730 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  padding-right:0.08em;
}
.pulse-stage .pulse-caption{
  margin-top:13px;
  font-weight:600;
  font-size:9px;
  letter-spacing:0.34em;
  color:rgba(195,205,208,0.5);
}
@keyframes pulse-breathe{
  0%{ transform:scale(1); }
  18%{ transform:scale(1.045); }
  42%{ transform:scale(1.0); }
  100%{ transform:scale(1.0); }
}
@keyframes pulse-glow{
  0%{ opacity:0.35; transform:scale(0.96); }
  18%{ opacity:0.9; transform:scale(1.08); }
  50%{ opacity:0.4; transform:scale(1.0); }
  100%{ opacity:0.35; transform:scale(0.96); }
}
@keyframes pulse-ripple{
  0%{ transform:scale(0.7); opacity:0; }
  12%{ opacity:0.5; }
  70%{ opacity:0.08; }
  100%{ transform:scale(2.0); opacity:0; }
}
@keyframes pulse-sweep{
  0%{ stroke-dashoffset:0; }
  100%{ stroke-dashoffset:-134; }
}
@keyframes pulse-enter{
  0%{ opacity:0; transform:translateY(8px); }
  100%{ opacity:1; transform:translateY(0); }
}
